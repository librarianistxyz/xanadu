<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151e"/>
      <stop offset="55%" stop-color="#0b2330"/>
      <stop offset="100%" stop-color="#06121a"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2df4e6"/>
      <stop offset="50%" stop-color="#1bdbdb"/>
      <stop offset="100%" stop-color="#0b93b8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1bdbdb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6efcf4" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="monkeyBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb85c"/>
      <stop offset="100%" stop-color="#d97724"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app badge background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#1bdbdb" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Subtle outer orbital halo -->
  <circle cx="256" cy="264" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="28 16" stroke-linecap="round"/>

  <!-- Sovereign Arch / Portal Canopy (non-X concept) -->
  <path d="M 116 368 C 116 200, 174 128, 256 128 C 338 128, 396 200, 396 368"
        fill="none" stroke="url(#archGrad)" stroke-width="34" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner horizon / globe arc -->
  <path d="M 154 342 Q 256 292 358 342"
        fill="none" stroke="#6efcf4" stroke-opacity="0.72" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="368" r="14" fill="#2df4e6"/>
  <circle cx="176" cy="356" r="8" fill="#1bdbdb" fill-opacity="0.75"/>
  <circle cx="336" cy="356" r="8" fill="#1bdbdb" fill-opacity="0.75"/>

  <!-- Cute SVG Monkey hanging from the top arch -->
  <g id="hanging-monkey">
    <!-- Curled tail wrapped over the top of the arch -->
    <path d="M 254 198 C 292 184, 304 134, 272 114 C 252 102, 232 116, 238 134"
          fill="none" stroke="#d97724" stroke-width="13" stroke-linecap="round"/>
    <!-- Left arm reaching up to hold the arch -->
    <path d="M 228 214 C 216 176, 218 148, 232 134"
          fill="none" stroke="url(#monkeyBody)" stroke-width="15" stroke-linecap="round"/>
    <!-- Right arm dangling playfully -->
    <path d="M 264 218 C 282 232, 288 252, 278 264"
          fill="none" stroke="url(#monkeyBody)" stroke-width="14" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 236 254 C 224 274, 224 288, 232 294"
          fill="none" stroke="#c8681c" stroke-width="14" stroke-linecap="round"/>
    <path d="M 256 256 C 264 276, 266 290, 258 296"
          fill="none" stroke="#c8681c" stroke-width="14" stroke-linecap="round"/>
    <!-- Torso -->
    <ellipse cx="246" cy="232" rx="24" ry="30" fill="url(#monkeyBody)"/>
    <ellipse cx="246" cy="235" rx="14" ry="19" fill="#ffe1b0"/>
    <!-- Ears -->
    <circle cx="212" cy="192" r="13" fill="#d97724"/>
    <circle cx="212" cy="192" r="7" fill="#ffd294"/>
    <circle cx="272" cy="192" r="13" fill="#d97724"/>
    <circle cx="272" cy="192" r="7" fill="#ffd294"/>
    <!-- Head (slightly tilted) -->
    <circle cx="242" cy="192" r="26" fill="url(#monkeyBody)"/>
    <!-- Face mask -->
    <ellipse cx="233" cy="190" rx="12" ry="13" fill="#ffe1b0"/>
    <ellipse cx="251" cy="190" rx="12" ry="13" fill="#ffe1b0"/>
    <ellipse cx="242" cy="202" rx="18" ry="12" fill="#ffe1b0"/>
    <!-- Eyes & smile -->
    <circle cx="233" cy="190" r="4" fill="#0b1a24"/>
    <circle cx="251" cy="190" r="4" fill="#0b1a24"/>
    <circle cx="234.5" cy="188.5" r="1.4" fill="#ffffff"/>
    <circle cx="252.5" cy="188.5" r="1.4" fill="#ffffff"/>
    <path d="M 234 203 Q 242 210 250 203" fill="none" stroke="#5a2c0c" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
